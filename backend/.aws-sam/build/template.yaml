AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: StudyHall UBC Backend API
Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256
    Environment:
      Variables:
        DB_HOST:
          Ref: DBHost
        DB_NAME:
          Ref: DBName
        DB_USER:
          Ref: DBUser
        DB_PASSWORD:
          Ref: DBPassword
        DB_PORT: '5432'
        AWS_BEDROCK_REGION:
          Ref: AWS::Region
  Api:
    Cors:
      AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
      AllowHeaders: '''Content-Type,Authorization'''
      AllowOrigin: '''*'''
Parameters:
  DBHost:
    Type: String
    Description: RDS PostgreSQL endpoint
  DBName:
    Type: String
    Default: studyhall
  DBUser:
    Type: String
    Default: postgres
  DBPassword:
    Type: String
    NoEcho: true
Resources:
  GetSubjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: subjects.getSubjects
      CodeUri: GetSubjectsFunction
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/subjects
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/subjects.ts
        Minify: true
        Target: es2022
      SamResourceId: GetSubjectsFunction
  GetSubjectDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: subjects.getSubjectDetail
      CodeUri: GetSubjectDetailFunction
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/subjects/{code}
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/subjects.ts
        Minify: true
        Target: es2022
      SamResourceId: GetSubjectDetailFunction
  GetSessionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: sessions.getSessions
      CodeUri: GetSessionsFunction
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/sessions
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/sessions.ts
        Minify: true
        Target: es2022
      SamResourceId: GetSessionsFunction
  GetSessionDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: sessions.getSessionDetail
      CodeUri: GetSessionDetailFunction
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/sessions/{id}
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/sessions.ts
        Minify: true
        Target: es2022
      SamResourceId: GetSessionDetailFunction
  RsvpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: attendance.rsvpSession
      CodeUri: RsvpFunction
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/sessions/{id}/rsvp
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/attendance.ts
        Minify: true
        Target: es2022
      SamResourceId: RsvpFunction
  CheckInFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: attendance.checkIn
      CodeUri: CheckInFunction
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/sessions/{id}/checkin
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/attendance.ts
        Minify: true
        Target: es2022
      SamResourceId: CheckInFunction
  GetAttendanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: attendance.getAttendance
      CodeUri: GetAttendanceFunction
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/sessions/{id}/attendance
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/attendance.ts
        Minify: true
        Target: es2022
      SamResourceId: GetAttendanceFunction
  UploadNotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: notes.uploadNotes
      CodeUri: UploadNotesFunction
      Timeout: 60
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/notes
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/notes.ts
        Minify: true
        Target: es2022
      SamResourceId: UploadNotesFunction
  GetGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: groups.getGroup
      CodeUri: GetGroupFunction
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/groups/{id}
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/groups.ts
        Minify: true
        Target: es2022
      SamResourceId: GetGroupFunction
  MatchGroupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: groups.matchGroups
      CodeUri: MatchGroupsFunction
      Timeout: 120
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/courses/{id}/match
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/groups.ts
        Minify: true
        Target: es2022
      SamResourceId: MatchGroupsFunction
  SeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: seed.seedDatabase
      CodeUri: SeedFunction
      Timeout: 120
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/seed
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/seed.ts
        Minify: true
        Target: es2022
      SamResourceId: SeedFunction
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
