AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: StudyHall UBC Backend API

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256
    Environment:
      Variables:
        DB_HOST: !Ref DBHost
        DB_NAME: !Ref DBName
        DB_USER: !Ref DBUser
        DB_PASSWORD: !Ref DBPassword
        DB_PORT: "5432"
        AWS_BEDROCK_REGION: !Ref AWS::Region
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"

Parameters:
  DBHost:
    Type: String
    Description: RDS PostgreSQL endpoint
  DBName:
    Type: String
    Default: studyhall
  DBUser:
    Type: String
    Default: postgres
  DBPassword:
    Type: String
    NoEcho: true

Resources:
  GetSubjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/subjects.getSubjects
      CodeUri: .
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/subjects
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - src/handlers/subjects.ts

  GetSubjectDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/subjects.getSubjectDetail
      CodeUri: .
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/subjects/{code}
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - src/handlers/subjects.ts

  GetSessionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/sessions.getSessions
      CodeUri: .
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/sessions
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - src/handlers/sessions.ts

  GetSessionDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/sessions.getSessionDetail
      CodeUri: .
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/sessions/{id}
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - src/handlers/sessions.ts

  RsvpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/attendance.rsvpSession
      CodeUri: .
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/sessions/{id}/rsvp
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - src/handlers/attendance.ts

  CheckInFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/attendance.checkIn
      CodeUri: .
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/sessions/{id}/checkin
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - src/handlers/attendance.ts

  GetAttendanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/attendance.getAttendance
      CodeUri: .
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/sessions/{id}/attendance
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - src/handlers/attendance.ts

  UploadNotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/notes.uploadNotes
      CodeUri: .
      Timeout: 60
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/notes
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - src/handlers/notes.ts

  GetGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/groups.getGroup
      CodeUri: .
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/groups/{id}
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - src/handlers/groups.ts

  MatchGroupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/groups.matchGroups
      CodeUri: .
      Timeout: 120
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/courses/{id}/match
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - src/handlers/groups.ts

  SeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/handlers/seed.seedDatabase
      CodeUri: .
      Timeout: 120
      Events:
        Api:
          Type: Api
          Properties:
            Path: /api/seed
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints:
          - src/handlers/seed.ts

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
